name: Publish Docker Hub Image

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Auto Version
        id: auto_ver
        run: |
          VERSION="2.6.${{ github.run_number }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Official Koodo Reader
        run: |
          git clone --depth 1 https://github.com/koodo-reader/koodo-reader.git /tmp/koodo-src
          cd /tmp/koodo-src
          yarn --ignore-scripts
          yarn build
          mkdir -p $GITHUB_WORKSPACE/koodo_reader
          cp -r build/* $GITHUB_WORKSPACE/koodo_reader/
          cd $GITHUB_WORKSPACE
          rm -rf /tmp/koodo-src

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/book-organizer
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.auto_ver.outputs.VERSION }}
            type=raw,value=v${{ steps.auto_ver.outputs.VERSION }}
            type=raw,value=sha-${{ steps.auto_ver.outputs.SHORT_SHA }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.auto_ver.outputs.VERSION }}
            BUILD_DATE=${{ steps.auto_ver.outputs.BUILD_TIME }}
            GIT_COMMIT=${{ steps.auto_ver.outputs.SHORT_SHA }}