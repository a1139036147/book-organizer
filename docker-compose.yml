version: '3.8'

services:
  book-organizer:
    image: arros/book-organizer:latest
    container_name: book-organizer
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "14808:14808"
    volumes:
      - /path/to/source:/source
      - /path/to/library:/library
      - ./config:/config
